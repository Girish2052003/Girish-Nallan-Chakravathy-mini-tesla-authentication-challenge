# GitHub Actions reads this YAML file and runs the checks on GitHub's computers.
# Indentation groups settings; a leading '-' adds one item to a list.
# This visible workflow name appears beside the check results.
name: tests

# Start a run for pushed commits and pull requests (proposed code changes).
on:
  # A push updates a remote branch with commits.
  push:
  # A pull request asks to merge one branch into another.
  pull_request:

# Give this workflow only read access to repository contents by default.
permissions:
  contents: read

# Jobs are separate groups of steps; jobs can run independently.
jobs:
  # This job exercises the actual Python implementation.
  pytest:
    # Use a new GitHub-hosted Ubuntu machine for each matrix entry.
    runs-on: ubuntu-latest
    # A matrix repeats the same steps for each Python version below.
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # Steps in this job run in the listed order.
    steps:
      # Download the repository at the revision GitHub selected for this run.
      # The long commit ID pins this action's code; the v4 comment is a label.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Do not leave write credentials in the checked-out Git configuration.
          persist-credentials: false
      # Install the requested Python using a fixed revision of the setup action.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # ${{ ... }} asks GitHub to substitute the current matrix value.
          python-version: ${{ matrix.python-version }}
          # Reuse pip's downloaded packages when a matching cache exists.
          cache: pip
          # Changing this lock file changes the dependency-cache lookup key.
          cache-dependency-path: requirements-ci.txt
      # Install the exact dependency versions and reject unapproved download bytes.
      - name: Install locked dependencies
        # --require-hashes checks each download against a listed SHA-256 hash;
        # -r means "read the package list from this file".
        run: python -m pip install --require-hashes -r requirements-ci.txt
      # Make mini_tesla importable from this checkout without changing dependencies.
      - name: Install package without dependency resolution
        # --no-deps skips dependency resolution; --no-build-isolation uses the
        # already installed build tools; -e links installation to this source tree.
        run: python -m pip install --no-deps --no-build-isolation -e .
      # Run all tests selected by the settings in pyproject.toml.
      - name: Test
        run: pytest
      # Exercise a finite grid of timing inputs and specific attack traces.
      - name: Finite input-grid and adversarial trace checks
        run: python verification/check_invariants.py
      # Check signed setup against a separate finite grid of trusted-clock values.
      - name: Signed-bootstrap time and signature input-grid checks
        run: python verification/check_bootstrap.py

  # This separate job explores finite mathematical models with the TLC tool.
  # It checks finite model properties under the stated assumptions; it is not
  # a proof of all Python behavior or of the assumptions' real-world truth.
  model-check:
    # Start on another new Ubuntu worker.
    runs-on: ubuntu-latest
    steps:
      # Fetch the same repository revision with the pinned checkout action.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Model exploration never needs saved repository write credentials.
          persist-credentials: false
      # Obtain the exact TLC release whose file hash the runners also verify.
      - name: Download and verify pinned TLC tool
        # | preserves the following shell lines as a multi-line command.
        # curl downloads the JAR: --fail rejects HTTP failures, --location follows
        # redirects, --retry 3 retries failures, and --output chooses its file.
        # The trailing backslash joins the URL on the next line to that command.
        # echo supplies the expected hash plus file path to sha256sum --check;
        # the pipe (|) sends that text into the hash-checking program.
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
      # Require either a clean model result or the exact intended counterexample
      # for each configuration. An unexpected failure still fails this job.
      - name: Check finite model and expected counterexamples
        # Pass the verified tool's location to both Python runner scripts.
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        # First run the message protocol model, then the signed-bootstrap model.
        run: |
          python3 verification/model/run_models.py
          python3 verification/model/run_bootstrap_models.py
