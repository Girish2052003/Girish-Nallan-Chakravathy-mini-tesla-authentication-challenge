name: cleanup merged branch

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository_owner == 'Girish2052003'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete only this PR's unchanged merged head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/cleanup_merged_branch.py
