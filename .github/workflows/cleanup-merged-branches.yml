name: cleanup merged branches

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.repository_owner == 'Girish2052003'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only branches proven merged into main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const protectedBranch = repository.default_branch;

            if (protectedBranch !== 'main') {
              core.setFailed(`Safety stop: default branch is ${protectedBranch}, expected main.`);
              return;
            }

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            for (const branch of branches) {
              const name = branch.name;

              // Absolute safety guard: never delete the default/main branch.
              if (name === protectedBranch || name === 'main') {
                core.info(`KEEP ${name}: authoritative branch`);
                continue;
              }

              const pulls = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: 'closed',
                  head: `${owner}:${name}`,
                  base: protectedBranch,
                  per_page: 100,
                }
              );

              const merged = pulls.some(
                (pr) => pr.merged_at !== null && pr.base.ref === protectedBranch
              );

              if (!merged) {
                core.warning(
                  `KEEP ${name}: no merged PR into ${protectedBranch}; refusing automatic deletion`
                );
                continue;
              }

              core.info(`DELETE ${name}: GitHub confirms a merged PR into ${protectedBranch}`);
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${name}`,
              });
            }
