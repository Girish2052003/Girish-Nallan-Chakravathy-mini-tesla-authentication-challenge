[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-tesla-authentication-challenge"
version = "0.1.0"
description = "HSM-backed Mini-TESLA delayed-disclosure message authentication challenge"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
