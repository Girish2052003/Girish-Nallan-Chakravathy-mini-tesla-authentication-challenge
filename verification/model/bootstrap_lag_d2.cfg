\* This file supplies one finite scenario to TLC, the tool that explores the TLA+
\* model. It is configuration, not Python code.
\* Allow one interval of receiver lag, use a matching safety margin, and wait two
\* intervals before release. All listed safety conditions must hold.
\* A backslash followed by * begins a comment. The runner requires the exact
\* expected result; a different error does not count as success. These results apply
\* to the finite model and its assumptions.

\* Choose settings that stay fixed for the whole model run.
CONSTANTS
\* Reveal each interval key 2 interval(s) later. Key 1 becomes public at time 1 + 2.
 Delay = 2
\* The actual receiver clock may trail the sender by up to one interval.
 Lag = 1
\* Add one interval to receiver time to estimate the latest possible sender time.
 Bound = 1
\* Read current modeled receiver time for both setup and packet admission.
 ClockMode = "live"
\* Enforce the ideal signature check; another signer cannot authenticate a fake
\* anchor.
 SigMode = "check"
\* Require the fresh receiver challenge, so an old signed reply does not match this
\* attempt.
 NonceMode = "check"
\* Use Spec from the model: its initial state and allowed next steps, including
\* steps that change nothing.
SPECIFICATION Spec
\* Do not fail just because no non-stuttering step is enabled. This finite safety
\* experiment does not promise eventual progress.
CHECK_DEADLOCK FALSE
\* Check each named condition in every reached state:
\* TypeOK: Every state variable keeps its permitted type, range, and basic
\* consistency rules.
\* AuthenticatedAnchor: The installed setup must never have an attacker-owned
\* anchor.
\* ChallengeFreshness: An old replayed setup must never be installed.
\* NoReleasedForgery: The receiver must never accept a forged message made with the
\* already public key.
\* HonestAfterDisclosure: Honest authentication must occur only once sender time
\* reaches the key-release deadline.
\* LiveSetupBeforeDisclosure: For a live-clock setup, the saved installation time
\* plus the margin must be before the first key-release deadline.
INVARIANTS TypeOK AuthenticatedAnchor ChallengeFreshness NoReleasedForgery HonestAfterDisclosure LiveSetupBeforeDisclosure
