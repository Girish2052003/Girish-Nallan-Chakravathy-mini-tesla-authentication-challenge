\* This file supplies one finite scenario to TLC, the tool that explores the TLA+
\* model. It is configuration, not Python code.
\* Keep the safe one-interval lag margin with a two-interval delay.
\* NoHonestAcceptance must fail to show that genuine acceptance remains possible.
\* A backslash followed by * begins a comment. The runner requires the exact
\* expected result; a different error does not count as success. These results apply
\* to the finite model and its assumptions.

\* Choose settings that stay fixed for the whole model run.
CONSTANTS
\* Explore two message-key intervals, 1 and 2. K[0] is the trusted public anchor.
 N = 2
\* Reveal each interval key 2 interval(s) later. Key 1 becomes public at time 1 + 2.
 Delay = 2
\* The actual receiver clock may trail the sender by up to one interval.
 Lag = 1
\* Add one interval to receiver time to estimate the latest possible sender time.
 Bound = 1
\* Store at most two waiting receipt records, keeping the explored state space
\* finite.
 BufferCapacity = 2
\* Use a strict time deadline: estimated latest sender time must be before public
\* key release.
 GuardMode = "deadline"
\* Use Spec from the model: its initial state and allowed next steps, including
\* steps that change nothing.
SPECIFICATION Spec
\* Do not fail just because no non-stuttering step is enabled. This finite safety
\* experiment does not promise eventual progress.
CHECK_DEADLOCK FALSE
\* Check each named condition in every reached state:
\* TypeOK: Every state variable keeps its permitted type, range, and basic
\* consistency rules.
\* KeyValidation: Known keys must be public and include their derivable older keys;
\* any successful key check must match the claimed chain index.
\* SourceAuthentication: Every accepted packet must be genuine and belong to an
\* interval actually sent by the honest sender.
\* ArrivalWhileSecret: An accepted packet must have arrived before its interval key
\* became public.
\* CorrectAuthentication: Every accepted packet must have a matching symbolic tag
\* and the correct interval key known by the receiver.
\* NoEarlyAcceptance: Each recorded checking time must be at or after that packet
\* interval plus the disclosure delay.
\* NoReplay: A logical message identity must never be accepted twice.
\* NoHonestAcceptance: Deliberately claim no genuine packet is ever accepted. A
\* genuine acceptance must refute this diagnostic rule.
INVARIANTS TypeOK KeyValidation SourceAuthentication ArrivalWhileSecret CorrectAuthentication NoEarlyAcceptance NoReplay NoHonestAcceptance
